name: "gadget-foo"
description: Periodically report chdir syscall counts by process
homepageURL: https://github.com/mqasimsarfraz/gadget-foo
documentationURL: https://github.com/mqasimsarfraz/gadget-foo#readme
sourceURL: https://github.com/mqasimsarfraz/gadget-foo
datasources:
  calls:
    fields:
      process_id:
        annotations:
          columns.hidden: "true"
      calls:
        annotations:
          description: Chdir attempts in this fetch interval
          columns.width: "12"
          columns.alignment: right
